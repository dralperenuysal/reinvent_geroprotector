# Plan B staged_learning (RL) config -- generated by
# reinvent_run/scripts/generate_staged_learning_toml.py run2, do not
# hand-edit the novelty reference list, regenerate instead.
#
# Reward function per AGENTS.md Section 6: SenmayoBridge oracle (0.5) + QED
# drug-likeness (0.2) + novelty vs LINCS library (0.15) + SAScore
# synthesizability (0.15), geometric mean.

run_type = "staged_learning"
device = "cpu"
tb_logdir = "/data/tb_logs_run2"
json_out_config = "/data/_staged_learning_run2.json"

[parameters]
summary_csv_prefix = "/data/run2"
use_checkpoint = false
purge_memories = false
prior_file = "/opt/REINVENT4/priors/reinvent_pubchem.prior"
agent_file = "/opt/REINVENT4/priors/reinvent_pubchem.prior"
batch_size = 128
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 100
rate = 0.0001

[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 5
minscore = 0.4

[[stage]]
chkpt_file = "/data/run2_stage1.chkpt"
termination = "simple"
max_score = 0.75
min_steps = 200
max_steps = 3000

[stage.scoring]
type = "geometric_mean"

# -- structural alert filter (applied before aggregation, no weight) --
[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"
params.smarts = [
    "[*;r8]",
    "[*;r9]",
    "[*;r10]",
    "[*;r11]",
    "[*;r12]",
    "[*;r13]",
    "[*;r14]",
    "[*;r15]",
    "[*;r16]",
    "[*;r17]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C#C",
    "C(=[O,S])[O,S]"
]

# -- main biological objective: SenMayo reversal (Plan B bridge model) --
[[stage.scoring.component]]
[stage.scoring.component.SenmayoBridge]
[[stage.scoring.component.SenmayoBridge.endpoint]]
name = "SenMayo_reversal"
weight = 0.5
params.model_file = "/opt/senmayo/bridge_model.joblib"
transform.type = "sigmoid"
transform.low = -1.0
transform.high = 2.5
transform.k = 0.5

# -- drug-likeness --
[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.2

# -- novelty: reward LOW similarity to the LINCS training library --
[[stage.scoring.component]]
